name: My First CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  basic-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README file
        run: |
          echo "Checking README.md..."
          test -f file-does-not-exist.txt
          echo "README.md exists. Test passed!"

  bash-check:
    needs: basic-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash script syntax
        run: |
          bash -n system-health-backup.sh
          echo "Bash syntax check passed!"
