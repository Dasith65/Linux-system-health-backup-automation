name: My First CI Pipeline

env:
  APP_NAME: "Dasith-CI-project"

on:
  push:
  workflow_dispatch:

jobs:
  basic-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display application name
        run: 'echo "Application: $APP_NAME"'
    
      - name: Run only if previous step succeeds
        if: success()
        run: echo "previous step succeeded!"

      - name: Check README file
        run: |
          echo "Checking README.md..."
          test -f README.md
          echo "README.md exists. Test passed!" 
          
      - name: Test required file
        run: |
          echo "Checking required file..."
          test -f README.md
          echo "Required file test passed!"
          
      - name: Create CI report
        run: |
          echo "CI Pipeline Report" > ci-report.txt 
          echo "Application: $APP_NAME" >> ci-report.txt
          echo "Branch: $GITHUB_REF_NAME" >> ci-report.txt
          cat ci-report.txt

      - name: Upload CI report artifact
        uses: actions/upload-artifact@v4
        with:
           name: ci-report
           path: ci-report.txt


      - name: Temporary failure test
        run: |
          echo "Testing failure handling..."
          exit 1

      - name: Verify always condition
        if: always()
        run: echo "Final verification step executed!"     

  bash-check:
    needs: basic-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash script syntax
        run: |
          bash -n system-health-backup.sh
          echo "Bash syntax check passed!"
